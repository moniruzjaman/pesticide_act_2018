<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Outer red ring -->
  <circle cx="128" cy="128" r="120" fill="red"/>
  
  <!-- Inner green ring -->
  <circle cx="128" cy="128" r="90" fill="green"/>
  
  <!-- Central red circle -->
  <circle cx="128" cy="128" r="60" fill="red"/>
  
  <!-- Text: Pesticide Act 2018 -->
  <text x="128" y="220" font-family="sans-serif" font-size="20" fill="white" text-anchor="middle">
    Pesticide Act 2018
  </text>
  
  <!-- Left icon: pesticide spray bottle -->
  <rect x="60" y="100" width="25" height="50" rx="5" fill="white"/>
  <text x="72" y="130" font-family="sans-serif" font-size="14" fill="black" text-anchor="middle">☠</text>
  <line x1="85" y1="100" x2="95" y2="90" stroke="white" stroke-width="3"/>
  <circle cx="98" cy="88" r="2" fill="white"/>
  <circle cx="102" cy="85" r="2" fill="white"/>
  <circle cx="106" cy="82" r="2" fill="white"/>
  
  <!-- Right icon: scales of justice on book -->
  <rect x="170" y="140" width="40" height="10" fill="white"/>
  <line x1="190" y1="100" x2="190" y2="140" stroke="white" stroke-width="3"/>
  <line x1="170" y1="100" x2="210" y2="100" stroke="white" stroke-width="3"/>
  <circle cx="175" cy="115" r="10" stroke="white" stroke-width="2" fill="none"/>
  <circle cx="205" cy="115" r="10" stroke="white" stroke-width="2" fill="none"/>
</svg>